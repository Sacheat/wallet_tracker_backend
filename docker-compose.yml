services:
  mysql:
    image: mysql:8.0
    container_name: wallet_tracker_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wallet_tracker
      MYSQL_USER: wallet_tracker
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wallet_tracker_pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: wallet_tracker
      PMA_PASSWORD: secret
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  db_data:
